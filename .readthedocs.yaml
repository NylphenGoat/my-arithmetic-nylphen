# Configuration Read the Docs (Exercice 6)
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # Historique complet + tags : nécessaire à hatch-vcs pour la version
    post_checkout:
      - git fetch --unshallow --tags || true

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
