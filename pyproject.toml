[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "my-arithmetic-nylphen"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "NylphenGoat", email = "munoznylphen@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/NylphenGoat/my-arithmetic-nylphen#readme"
Issues = "https://github.com/NylphenGoat/my-arithmetic-nylphen/issues"
Source = "https://github.com/NylphenGoat/my-arithmetic-nylphen"

[tool.hatch.version]
source = "vcs"

# Versions façon git-flow : 0.1, 0.1.post1.dev2, ... (pas de suffixe local +g<hash>)
[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
fallback_version = "0.0"

# Fichier de version généré à la construction (non versionné)
[tool.hatch.build.hooks.vcs]
version-file = "src/my_arithmetic_nylphen/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/my_arithmetic_nylphen tests}"

[tool.coverage.run]
source_pkgs = ["my_arithmetic_nylphen", "tests"]
branch = true
parallel = true
omit = [
  "src/my_arithmetic_nylphen/__about__.py",
]

[tool.coverage.paths]
my_arithmetic_nylphen = ["src/my_arithmetic_nylphen", "*/my-arithmetic-nylphen/src/my_arithmetic_nylphen"]
tests = ["tests", "*/my-arithmetic-nylphen/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
