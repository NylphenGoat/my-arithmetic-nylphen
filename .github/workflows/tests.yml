# Exercices 5 et 6 : tests unitaires + couverture à chaque modification de code,
# envoi de la couverture sur coveralls.io
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet + tags : nécessaire à hatch-vcs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install hatch coverage
      - run: hatch test --cover
      # Rapport au format lcov, lu par Coveralls
      - run: coverage lcov -o coverage.lcov
      - name: Publication de la couverture sur Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
          format: lcov
